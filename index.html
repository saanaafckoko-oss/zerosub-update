html{color-scheme:dark}
html[data-mode=light]{color-scheme:light}
.zf-logo{position:relative;width:44px;height:44px;flex:none;border-radius:0;background:var(--zf-logo) center/contain no-repeat;border:0;box-shadow:none;animation:zfPulse 1.7s linear infinite,zfSwing 4.8s ease-in-out infinite}
.zf-logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%) 120% 0/220% 100% no-repeat;-webkit-mask:var(--zf-logo) center/contain no-repeat;mask:var(--zf-logo) center/contain no-repeat;animation:zfShine 2.6s linear infinite;pointer-events:none}
@keyframes zfSwing{0%,100%{transform:perspective(260px) rotateY(-16deg) rotateX(4deg) scale(1)}50%{transform:perspective(260px) rotateY(16deg) rotateX(-3deg) scale(1.07)}}
@keyframes zfShine{0%{background-position:120% 0}100%{background-position:-20% 0}}
@keyframes zfPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(var(--glow),.7)) drop-shadow(0 0 10px rgba(255,120,0,.5))}8%{filter:drop-shadow(0 0 8px rgba(255,210,70,.95)) drop-shadow(0 0 18px rgba(255,90,0,.85))}15%{filter:drop-shadow(0 0 3px rgba(var(--glow),.5)) drop-shadow(0 0 7px rgba(255,120,0,.3))}28%{filter:drop-shadow(0 0 10px rgba(255,220,90,1)) drop-shadow(0 0 22px rgba(255,100,0,.9))}41%{filter:drop-shadow(0 0 5px rgba(var(--glow),.65)) drop-shadow(0 0 12px rgba(255,110,0,.5))}56%{filter:drop-shadow(0 0 2px rgba(var(--glow),.4)) drop-shadow(0 0 6px rgba(255,120,0,.25))}70%{filter:drop-shadow(0 0 9px rgba(255,205,80,.95)) drop-shadow(0 0 20px rgba(255,90,0,.85))}85%{filter:drop-shadow(0 0 5px rgba(var(--glow),.6)) drop-shadow(0 0 11px rgba(255,110,0,.45))}}
header{gap:6px!important;padding:9px 10px!important}
header h1.zf-brand{display:flex;align-items:center;gap:9px;min-width:0;font:800 16px "Noto Sans Khmer",system-ui,sans-serif!important;letter-spacing:.4px}
.zf-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 10px rgba(var(--glow),.45)}
.zf-pro{flex:none;font-size:10px;font-weight:800;color:var(--accT);background:var(--acc);border-radius:6px;padding:1px 6px;margin-left:-2px;vertical-align:middle;letter-spacing:.5px;text-shadow:none}
header .ic{width:36px;height:36px;flex:none;justify-content:center;border-radius:13px;background:rgba(var(--glow),.12);border:1px solid rgba(var(--glow),.42);color:var(--acc);padding:0}
header .ic svg.i{width:20px!important;height:20px!important;margin:0}
header #pal svg.i{width:20px!important;height:20px!important}
header #out{margin-left:0!important;color:#f87171!important;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45)}
header #out svg.i{width:19px!important;height:19px!important}
.zf-chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 0;max-width:560px;margin:auto}
.zf-chip{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:44px;box-sizing:border-box;border:1.5px solid var(--line);border-radius:16px;padding:6px 8px;font-size:12.5px;font-weight:800;text-align:center;line-height:1.35;background:linear-gradient(180deg,rgba(var(--glow),.18),rgba(var(--glow),.05));box-shadow:0 2px 10px rgba(var(--glow),.18),inset 0 1px 0 rgba(255,255,255,.14);color:var(--ink)}
.zf-chip.ok{border-color:#10b981;color:#6ee7b7;background:linear-gradient(180deg,rgba(16,185,129,.24),rgba(16,185,129,.06));box-shadow:0 2px 10px rgba(16,185,129,.25),inset 0 1px 0 rgba(255,255,255,.14)}
.zf-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;flex:none;animation:zfBlink 1.6s ease-in-out infinite}@keyframes zfBlink{0%,100%{opacity:1}50%{opacity:.35}}
body.zf-locked{overflow:hidden}
body.zf-locked>header,body.zf-locked>main,body.zf-locked>.zf-chips{visibility:hidden}
#zfAuth{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:radial-gradient(120% 70% at 50% 0%,rgba(var(--glow),.25),transparent 62%),var(--bg);overflow:auto}
body.zf-locked #zfAuth{display:flex}
#zfAuth .zf-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;gap:8px}
#zfAuth .zf-top button{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--glow),.12);border:1px solid rgba(var(--glow),.42);color:var(--acc);padding:0}
#zfAuth .zf-top svg{width:22px;height:22px}
.zf-hero{text-align:center;margin-bottom:20px}
.zf-hero .zf-logo{width:128px;height:128px;margin:0 auto 14px}
.zf-hero h2{margin:0;font:900 30px "Noto Sans Khmer",system-ui,sans-serif;letter-spacing:1.5px;text-shadow:0 0 16px rgba(var(--glow),.6)}
.zf-hero small{display:block;margin-top:6px;color:var(--mut);font-weight:700;letter-spacing:1px}
.zf-panel{width:100%;max-width:400px;border:2px solid var(--line);border-radius:30px;padding:18px;background:rgba(0,0,0,.25);box-shadow:0 0 26px rgba(var(--glow),.2),inset 0 0 18px rgba(var(--glow),.07)}
.zf-help{margin:0 0 12px;text-align:center;color:var(--mut);font-size:14px}
#zfKey{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:17px;font-weight:700}
#zfErr{display:none;margin:12px 0 0;padding:11px 13px;border-radius:14px;background:rgba(239,68,68,.14);border:1.5px solid rgba(239,68,68,.65);color:#fecaca;font-size:14px;font-weight:700;line-height:1.5;text-align:center}
.zf-act{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.zf-act .b{width:100%;padding:15px 10px;font-size:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:normal}
.zf-act .b[disabled]{opacity:.6}
.zf-act a.b{color:#fff;text-align:center}
.zf-act a.b:visited{color:#fff}
.zf-wm{margin-top:18px;text-align:center;color:var(--mut);font-size:12px;font-weight:700;line-height:1.6}
/* admin card */
#zfAdm .zf-hd{display:flex;align-items:center;gap:10px}
#zfAdm .zf-hd .t{flex:1;margin:0}
#zfTog,#zfTog2{flex:none;width:auto;min-width:74px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;border-radius:14px}
#zfTog svg,#zfTog2 svg{width:18px;height:18px;transition:transform .2s}
#zfTog.closed svg,#zfTog2.closed svg{transform:rotate(180deg)}
#zfBody{margin-top:10px}
#zfBody.hide{display:none!important}
#zfAdm .zf-q{display:flex;gap:8px;margin:10px 0 0}
#zfAdm .zf-q .b{flex:1;padding:9px 4px;font-size:13px;border-radius:12px}
.zf-out{margin-top:12px;padding:12px;border-radius:16px;border:1.5px dashed var(--line);background:rgba(var(--glow),.08);display:flex;align-items:center;gap:10px}
.zf-out.hide{display:none}
.zf-out code{flex:1;min-width:0;font:800 16px "Fira Code",monospace;color:var(--acc);letter-spacing:1px;word-break:break-all;user-select:all}
.zf-out .b{flex:none;padding:10px 12px;font-size:13px;border-radius:12px}
.zf-note{color:var(--mut);font-size:12.5px;line-height:1.5;margin:10px 0 0}
.zf-lh{display:flex;align-items:center;gap:8px}
.zf-lh .t{flex:1;margin:0}
.zf-lh .b{flex:none;padding:9px 11px;font-size:12.5px;border-radius:12px}
#zfList{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.zf-empty{color:var(--mut);font-size:13px;text-align:center;padding:10px}
.zf-row{border:1.5px solid #2a3350;border-left-width:4px;border-radius:16px;padding:10px 12px;background:rgba(0,0,0,.18)}
.zf-row.un{border-left-color:#64748b}.zf-row.on{border-left-color:#10b981}.zf-row.ex{border-left-color:#ef4444}
.zf-r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zf-r1 code{flex:1 1 150px;min-width:0;font:800 14px "Fira Code",monospace;letter-spacing:.5px;word-break:break-all;user-select:all}
.zf-d{font:800 12px "Fira Code",monospace;color:#a5a8ff;border:1.5px solid var(--vio);border-radius:10px;padding:2px 8px}
.zf-st{font-size:12.5px;font-weight:700;margin-top:5px}
.zf-st.un{color:var(--mut)}.zf-st.on{color:#34d399}.zf-st.ex{color:#f87171}
.zf-ra{display:flex;gap:8px;margin-top:8px}
.zf-ra .b{flex:1;padding:8px 4px;font-size:12.5px;border-radius:12px}
.zf-add{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.zf-add.open{display:flex}
.zf-add .b{flex:none;padding:7px 11px;font-size:12.5px;border-radius:11px}
.zf-add input{flex:1 1 70px;min-width:0;padding:7px 10px;border-radius:11px;font-size:13px}
#zfCf>div{max-width:560px;margin:auto}
#zfCfT{display:block;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
/* ===== LIGHT (day) MODE ===== */
html[data-mode=light]{--bg:#f6f1e6!important;--hdr:#fffaf0!important;--ink:#2a1b0a!important;--mut:#6c5c43!important;--dk:#fff!important;--accx:color-mix(in srgb,var(--acc) 52%,#000)}
html[data-mode=light] body{background:var(--bg) linear-gradient(180deg,rgba(255,255,255,.55),rgba(120,90,30,.07))}
html[data-mode=light] header{box-shadow:0 3px 12px rgba(90,60,10,.15)}
html[data-mode=light] .zf-name{text-shadow:none}
html[data-mode=light] header .ic{color:var(--accx);background:rgba(var(--glow),.16)}
html[data-mode=light] header #out{color:#dc2626!important}
html[data-mode=light] .days,html[data-mode=light] .zf-r1 code{color:var(--accx)}
html[data-mode=light] .zf-chip.ok{color:#047857}
html[data-mode=light] .card{background:rgba(255,255,255,.72);box-shadow:0 4px 18px rgba(var(--glow),.2),inset 0 0 10px rgba(var(--glow),.08)}
html[data-mode=light] .card.in,html[data-mode=light] #p-export>.card.in{background:#fff;border-color:#e3d6bb;box-shadow:0 1px 4px rgba(0,0,0,.08)}

function zsfDigitsKm(str){return str.split("").map(function(c){return ZSF_KD[+c]}).join("")}
function zsfNumToKhmer(t){

 t=t.replace(/([$\u20AC\u00A5\uFFE5\u00A3])\s?(\d[\d,]*(?:\.\d+)?)/g,function(m,cur,num){return num+({"$":"ដុល្លារ","\u20AC":"អឺរ៉ូ","\u00A5":"យ័ន","\uFFE5":"យ័ន","\u00A3":"ផោន"}[cur]||"")});

async function zsFastSave(name,b){
 var N=window.ZSNative;
 if(window.ZSFApp||!N||typeof N.putFile!=="function"||typeof N.saveToDownloads!=="function")return false;
 var CH=6*1024*1024,total=b.size,tmp="zsdl_"+Date.now()+".bin",t0=performance.now(),wrote=0;
 if(!total)return false;
 var rd=function(o){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var s=String(fr.result);res(s.slice(s.indexOf(",")+1))};fr.onerror=function(){rej(fr.error||new Error("read"))};fr.readAsDataURL(b.slice(o,Math.min(total,o+CH)))})};
 var mb=function(x){return (x/1048576).toFixed(0)};
 var say=function(p,m){try{setProgress(p,m)}catch(e){}try{showToast(m,true)}catch(e){}};
 var next=null;
 try{
  next=rd(0);
  for(var o=0;ototal;o+=CH){
   var s=await next;next=null;
   if(o+CHtotal){next=rd(o+CH);next.catch(function(){})}
   if(N.putFile(tmp,s,o>0)!==true)throw new Error("putFile");
   wrote=Math.min(total,o+CH);
   var sec=Math.max(.1,(performance.now()-t0)/1000);
   say(Math.min(98,Math.round(wrote/total*100)),"📥 កំពុងរក្សាទុកវីដេអូ "+mb(wrote)+"/"+mb(total)+" MB • "+(wrote/1048576/sec).toFixed(1)+" MB/s");
  }
  say(99,"📥 កំពុងចម្លងចូល Download...");
  var r=await new Promise(function(res){
   var cb="zsFastCb"+Date.now(),tm=setTimeout(function(){delete window[cb];res({ok:false,error:"timeout"})},10*60*1000);
   window[cb]=function(x){clearTimeout(tm);delete window[cb];res(x||{ok:false})};
   try{N.saveToDownloads(name,b.type||"video/mp4",tmp,cb)}catch(e){clearTimeout(tm);delete window[cb];res({ok:false,error:String(e)})}
  });
  try{N.deleteFile(tmp)}catch(e){}
  if(!r||!r.ok)throw new Error((r&&r.error)||"saveToDownloads");
  try{setProgress(100,"✅ រក្សាទុករួច")}catch(e){}
  try{showToast("✅ រក្សាទុករួចក្នុង Downloads: "+name+" ("+mb(total)+" MB)",true)}catch(e){}
  return true;
 }catch(err){
  try{N.deleteFile(tmp)}catch(e){}
  try{setProgress(0,"❌ រក្សាទុកមិនបាន: "+String(err&&err.message||err))}catch(e){}
  try{showToast("❌ រក្សាទុកមិនបាន: "+String(err&&err.message||err)+(wrote?" (ទំហំទូរសព្ទពេញ?)":""),false)}catch(e){}
  return wrote>0;   /* បើបរាជ័យមុនសរសេរអ្វីទាំងអស់ → ត្រឡប់ទៅវិធីចាស់ */
 }
}

  function newer(a,b){var x=String(a).split("."),y=String(b).split(".");for(var i=0;i<Math.max(x.length,y.length);i++){var p=parseInt(x[i]||0,10),q=parseInt(y[i]||0,10);if(p!==q)return p>q;}return false;}
  function tries(){try{return parseInt(localStorage.getItem("zsf_upd_try")||"0",10)||0}catch(e){return 0}}
  function setTries(n){try{if(n)localStorage.setItem("zsf_upd_try",String(n));else localStorage.removeItem("zsf_upd_try")}catch(e){}}
  function dbOpen(cb){try{var q=indexedDB.open("zsf_pkg",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv")};q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb(null)};}catch(e){cb(null)}}
  function getCached(cb){dbOpen(function(db){if(!db)return cb(null);try{var g=db.transaction("kv","readonly").objectStore("kv").get("html");g.onsuccess=function(){cb(g.result||null)};g.onerror=function(){cb(null)};}catch(e){cb(null)}})}
  function dropCached(){dbOpen(function(db){try{if(db)db.transaction("kv","readwrite").objectStore("kv").delete("html")}catch(e){}})}
  function run(html,ver,fromCache){
    window.__ZSF_VER=ver;
    document.open();document.write(html);document.close();
    /* V1.15: document.open() លុប listener ទាញយករបស់ APK — ដាក់វាវិញ */
    try{
      if(window.ZSFApp){
        if(window.__zsfDlH)document.removeEventListener("click",window.__zsfDlH,true);
        window.__zsfDlH=function(e){
          var a=e.target&&e.target.closest?e.target.closest("a[download]"):null;
          if(!a)return;var h=a.href||"";if(h.indexOf("blob:")!==0)return;
          e.preventDefault();e.stopPropagation();
          var name=a.getAttribute("download")||"file";
          fetch(h).then(function(r){return r.blob()}).then(async function(b){
            if(!ZSFApp.begin(name,b.type||"application/octet-stream"))return;
            var CH=3*1024*1024;
            for(var o=0;o<b.size;o+=CH){
              var u=new Uint8Array(await b.slice(o,o+CH).arrayBuffer()),t="";
              for(var i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
              ZSFApp.chunk(btoa(t));
            }
            ZSFApp.end();
          }).catch(function(err){try{ZSFApp.abort(String(err))}catch(_){}});
        };
        document.addEventListener("click",window.__zsfDlH,true);
      }
    }catch(_){}
    /* V1.90: APK ចាស់ (គ្មាន ZSFApp) — រក្សាទុកឯកសារធំជាដុំៗ 3MB តាម ZSNative.putFile + saveToDownloads ជំនួស saveBase64 (ដែលធ្វើឱ្យ RAM ពេញ) */
    try{
      if(!window.ZSFApp && window.ZSNative && typeof ZSNative.putFile==="function" && typeof ZSNative.saveToDownloads==="function"){
        var zsToast=function(m){try{var t=document.getElementById("zsChunkToast");if(!t){t=document.createElement("div");t.id="zsChunkToast";t.style.cssText="position:fixed;left:12px;right:12px;bottom:24px;z-index:2147483647;background:#1e1033;color:#fff;border:1px solid #7e22ce;border-radius:12px;padding:12px 14px;font:14px/1.5 sans-serif;text-align:center";(document.body||document.documentElement).appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},6000)}catch(e){}};
        var zsIsDl=function(a){return a&&a.hasAttribute&&a.hasAttribute("download")&&a.href&&a.href.indexOf("blob:")===0};
        var zsSave=function(a){
          var name=a.getAttribute("download")||"file";
          fetch(a.href).then(function(r){return r.blob()}).then(async function(b){
            var tmp="zsdl_"+Date.now()+".bin",CH=3*1024*1024,ok=true;
            zsToast("កំពុងរក្សាទុក… 0%");
            for(var o=0;o<b.size;o+=CH){
              var u=new Uint8Array(await b.slice(o,o+CH).arrayBuffer()),t="";
              for(var i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
              if(!ZSNative.putFile(tmp,btoa(t),o>0)){ok=false;break}
              zsToast("កំពុងរក្សាទុក… "+Math.min(99,Math.round((o+CH)/b.size*100))+"%");
            }
            if(!ok){try{ZSNative.deleteFile(tmp)}catch(_){}zsToast("រក្សាទុកមិនបាន (ទំហំទូរសព្ទពេញ?)");return}
            var cb="zsDlCb"+Date.now();
            window[cb]=function(r){try{ZSNative.deleteFile(tmp)}catch(_){}delete window[cb];zsToast(r&&r.ok?"✅ រក្សាទុករួចក្នុង Downloads: "+name:"រក្សាទុកមិនបាន: "+(r&&r.error||""))};
            ZSNative.saveToDownloads(name,b.type||"application/octet-stream",tmp,cb);
          }).catch(function(err){zsToast("រក្សាទុកមិនបាន: "+err)});
        };
        if(window.__zsChunkH)document.removeEventListener("click",window.__zsChunkH,true);
        window.__zsChunkH=function(e){var a=e.target&&e.target.closest?e.target.closest("a[download]"):null;if(zsIsDl(a)){e.preventDefault();e.stopPropagation();zsSave(a)}};
        document.addEventListener("click",window.__zsChunkH,true);
        if(!window.__zsChunkP){
          window.__zsChunkP=1;
          var prevClick=HTMLAnchorElement.prototype.click;
          HTMLAnchorElement.prototype.click=function(){if(zsIsDl(this)){zsSave(this);return}return prevClick.apply(this,arguments)};
        }
      }
    }catch(_){}
    setTimeout(function(){ if(document.getElementById("authScreen")||document.getElementById("mainApp")) setTries(0); },8000);
  }
  function embedded(){return document.getElementById("zsfApp").textContent.split("\uE000").join("<")}
  getCached(function(c){
    var t=tries(),use=false;
    if(c&&typeof c.html==="string"&&c.html.length>100000&&c.html.indexOf("zsf-boot")>0&&c.html.indexOf("ZERO SUB FLASH")>0&&c.ver&&newer(c.ver,EMB)){
      if(t>=2){dropCached();setTries(0);} else {use=true;setTries(t+1);}
    }
    if(use){run(c.html,c.ver,true);return}
    if(firstDone()){run(embedded(),EMB,false);return}
    /* V1.52: ដំឡើងថ្មី/បើកលើកដំបូង → ពិនិត្យ និងទាញកំណែថ្មីបំផុតដោយស្វ័យប្រវត្តិ (គ្មានប៊ូតុង) */
    var fired=false;
    function go(r){
      if(fired)return;fired=true;
      if(r){setTries(1);run(r.html,r.ver,true)}else run(embedded(),EMB,false);
    }
    setTimeout(function(){go(null)},120000);
    firstRun().then(go,function(){go(null)});
  });
  var FIRST_BASE="https://raw.githubusercontent.com/saanaafckoko-oss/zerosub-update/main/";
  function firstDone(){try{return localStorage.getItem("zsf_first_upd")==="1"}catch(e){return false}}
  function firstMark(){try{localStorage.setItem("zsf_first_upd","1")}catch(e){}}
  function splash(msg,pct){
    try{
      var d=document.getElementById("zsfFirst");
      if(!d){
        d=document.createElement("div");d.id="zsfFirst";
        d.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0f0a1a;color:#fff;font-family:sans-serif;text-align:center;padding:24px";
        d.innerHTML='<div style="font-size:22px;font-weight:800;letter-spacing:2px">ZERO SUB FLASH</div><div id="zsfFirstMsg" style="font-size:15px;line-height:1.7;opacity:.92;white-space:pre-line"></div><div style="width:210px;height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden"><div id="zsfFirstBar" style="width:10%;height:100%;border-radius:6px;background:linear-gradient(90deg,#c084fc,#7e22ce);transition:width .5s"></div></div>';
        (document.body||document.documentElement).appendChild(d);
      }
      var m=document.getElementById("zsfFirstMsg");if(m)m.textContent=msg;
      var b=document.getElementById("zsfFirstBar");if(b&&pct)b.style.width=pct+"%";
    }catch(e){}
  }
  function fetchT(url,ms){
    return new Promise(function(res,rej){
      var done=false,ctl=window.AbortController?new AbortController():null;
      var tm=setTimeout(function(){if(done)return;done=true;try{ctl&&ctl.abort()}catch(e){}rej(new Error("timeout"))},ms);
      fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
        if(!r.ok){if(done)return;done=true;clearTimeout(tm);rej(new Error("HTTP "+r.status));return}
        return r.text().then(function(t){if(done)return;done=true;clearTimeout(tm);res(t)});
      }).catch(function(e){if(done)return;done=true;clearTimeout(tm);rej(e)});
    });
  }
  function idbPutObj(o){return new Promise(function(res,rej){try{var r=indexedDB.open("zsf_pkg",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onerror=function(){rej(r.error)};r.onsuccess=function(){try{var t=r.result.transaction("kv","readwrite");t.objectStore("kv").put(o,"html");t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}}catch(e){rej(e)}}}catch(e){rej(e)}})}
  async function firstRun(){
    splash("កំពុងពិនិត្យកំណែថ្មី…",15);
    try{
      var v=String(await fetchT(FIRST_BASE+"version.txt?t="+Date.now(),9000)).trim();
      if(!v||v.length>20)throw new Error("bad version");
      if(!newer(v,EMB)){firstMark();return null}
      splash("កំពុងទាញយកកំណែថ្មី v"+v+"\nសូមរង់ចាំបន្តិច…",45);
      var w=await fetchT(FIRST_BASE+"index.html?t="+Date.now(),90000);
      var key='var EMB'+'="',k=w.lastIndexOf(key),nv=k<0?"":w.slice(k+key.length,w.indexOf('"',k+key.length));
      var s0=w.indexOf('id="zsfApp">'),s1=s0<0?-1:w.indexOf("<"+"/script>",s0);
      if(s0<0||s1<0||!nv||!newer(nv,EMB))throw new Error("bad package");
      var html=w.slice(s0+12,s1).split("").join("<");
      if(html.length<100000||html.indexOf("ZERO SUB FLASH")<0||html.indexOf("zsf-boot")<0)throw new Error("bad html");
      splash("កំពុងរៀបចំកំណែ v"+nv+"…",90);
      await idbPutObj({ver:nv,html:html});
      firstMark();
      return {ver:nv,html:html};
    }catch(e){return null}
  }
})();
